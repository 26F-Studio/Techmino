[package]
name = "techmino-transport"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace]

[lib]
name = "techmino_transport"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "=0.22.1"
futures-util = { version = "=0.3.31", default-features = false, features = ["std", "sink"] }
getrandom = "=0.2.16"
parking_lot = "=0.12.5"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "stream"] }
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "=0.7.16", default-features = false, features = ["rt"] }
webpki-roots = "=1.0.4"
zeroize = "=1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
